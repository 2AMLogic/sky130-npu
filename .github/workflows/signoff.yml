# Re-grade this block's gap-to-T1 state from the committed signoff manifest.
#
# `klt signoff --manifest` is re-run and its output compared with the committed
# report (manifests/sky130-npu.signoff.json), so a manifest edit, an evidence
# change or a grading-relevant klt change that is not accompanied by a fresh
# report fails the build instead of quietly diverging from what the repo claims.
#
# Exit 3 means "not yet T1" (some item is unmet): a successful, expected run.
# The gate is the diff, not the exit code; exit 0 and 3 pass, anything else
# fails.
#
# klt is pinned to one PyPI release, KLT_VERSION below. Its bundled T1
# checklist fixes the item skeleton and text, so a floating install would
# churn the committed report. Bump KLT_VERSION (and flow/toolchain.json)
# together with a regenerated report (see manifests/README.md).

name: signoff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KLT_VERSION: 0.8.0

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the pinned klt (klayout-tools)
        run: |
          uv tool install "klayout-tools==${KLT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show the klt version
        run: |
          v="$(klt --version)"
          echo "$v"
          [ "$v" = "klt ${KLT_VERSION}" ] || { echo "::error::expected 'klt ${KLT_VERSION}', got '$v'"; exit 1; }

      - name: Re-run klt signoff and diff against the committed report
        run: |
          set +e
          klt signoff --manifest manifests/sky130-npu.json --format json > /tmp/signoff-fresh.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff failed (exit $rc)"
            cat /tmp/signoff-fresh.json
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "note: block is not yet T1 (klt signoff exit 3), expected until every item is met"
          fi
          if ! diff -u manifests/sky130-npu.signoff.json /tmp/signoff-fresh.json; then
            echo "::error::fresh klt signoff grade differs from the committed report manifests/sky130-npu.signoff.json"
            echo "Regenerate it: see manifests/README.md"
            exit 1
          fi
          echo "signoff report reproduced"

      - name: Re-attest T1 item 10 and check the committed attestation
        run: |
          klt signoff --attest 10 \
            --inventory manifests/inventories/item-10.json \
            --check manifests/attestations/item-10.json \
            --format json
