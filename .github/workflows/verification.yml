name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ICARUS_TAG: v13_0

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verification/requirements.txt

      - name: Cache Icarus
        id: icarus-cache
        uses: actions/cache@v4
        with:
          path: ~/icarus
          key: icarus-${{ env.ICARUS_TAG }}-ubuntu-24.04

      - name: Build Icarus ${{ env.ICARUS_TAG }}
        if: steps.icarus-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf gperf flex bison build-essential
          git clone --depth 1 --branch "$ICARUS_TAG" https://github.com/steveicarus/iverilog.git /tmp/iverilog
          cd /tmp/iverilog
          sh autoconf.sh
          ./configure --prefix="$HOME/icarus"
          make -j2
          make install

      - name: Smoke test
        run: |
          export PATH="$HOME/icarus/bin:$PATH"
          python -m venv .venv
          .venv/bin/pip install -r verification/requirements.txt
          EXPECT_ICARUS=13.0 .venv/bin/python verification/runner.py

  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Golden model unit tests
        run: python -m unittest discover -s verification/tests -p 'test_golden.py'

  # Elaboration and lint of rtl/ at the target (8) and fallback (4) sizes, and
  # the negative cases (6, 16). Two small Icarus + Yosys `hierarchy -check`
  # runs plus two expected failures; no synthesis, no simulation. Uses the
  # distro's iverilog and yosys (not the pins in flow/toolchain.json): this is
  # an elaboration gate, not a tool-version result.
  rtl-elaborate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Elaborate and lint at ARRAY_N 8 and 4, reject 6 and 16
        run: ./rtl/check.sh
