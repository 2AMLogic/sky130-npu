name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ICARUS_TAG: v13_0
  # Where the harness finds the RTL. A stamped port changes only these two.
  NPU_RTL_DIR: rtl
  NPU_PDK_DIR: rtl/pdk/sky130

jobs:
  bitexact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verification/requirements.txt

      - name: Cache Icarus
        id: icarus-cache
        uses: actions/cache@v4
        with:
          path: ~/icarus
          key: icarus-${{ env.ICARUS_TAG }}-ubuntu-24.04

      - name: Build Icarus ${{ env.ICARUS_TAG }}
        if: steps.icarus-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf gperf flex bison build-essential
          git clone --depth 1 --branch "$ICARUS_TAG" https://github.com/steveicarus/iverilog.git /tmp/iverilog
          cd /tmp/iverilog
          sh autoconf.sh
          ./configure --prefix="$HOME/icarus"
          make -j2
          make install

      - name: Verification gate, bitexact group (ARRAY_N 8 and 4)
        run: |
          export PATH="$HOME/icarus/bin:$PATH"
          python -m venv .venv
          .venv/bin/pip install -r verification/requirements.txt
          ./verification/check-all.sh bitexact

  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Workflow-startup guard, mirrored into signoff.yml's grade job: each
      # workflow parses every file in .github/workflows/ (both of them, this
      # one included) with a real YAML parser, so a workflow that cannot
      # start leaves a surviving reader in the other workflow to go red
      # instead of vanishing from a green gate.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The script's golden group runs the same uv-wrapped checker this job's
      # comment above describes.
      - name: Verification gate, golden group
        run: ./verification/check-all.sh golden

      - name: Workflow checker's own unit tests
        run: uv run --with pyyaml==6.0.3 python -m unittest discover -s verification/tests -p 'test_check_workflows.py'

  # Elaboration and lint of rtl/ at the target (8) and fallback (4) sizes, and
  # the negative cases (6, 16). Two small Icarus + Yosys `hierarchy -check`
  # runs plus two expected failures; no synthesis, no simulation. Uses the
  # distro's iverilog and yosys (not the pins in flow/toolchain.json): this is
  # an elaboration gate, not a tool-version result.
  rtl-elaborate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Verification gate, rtl-elaborate group
        run: ./verification/check-all.sh rtl-elaborate
